<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Локальный RAG-чат по PDF</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 800px; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 8px; display: flex; flex-direction: column; height: 90vh; }
        .chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; border-bottom: 1px solid #ddd; }
        .input-area { display: flex; padding: 20px; }
        #question-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        #send-button { padding: 10px 20px; margin-left: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #send-button:disabled { background-color: #a0cfff; cursor: not-allowed; }
        .message { margin-bottom: 15px; }
        .message.user { text-align: right; }
        .message .bubble { display: inline-block; padding: 10px 15px; border-radius: 18px; max-width: 70%; }
        .message.user .bubble { background-color: #007bff; color: white; }
        .message.bot .bubble { background-color: #e9ecef; color: #495057; }
        .loading { text-align: center; color: #888; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <div class="bubble">Здравствуйте! Я готов ответить на ваши вопросы по загруженным PDF-документам.</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="question-input" placeholder="Введите ваш вопрос...">
            <button id="send-button">Отправить</button>
        </div>
    </div>
<script>
    // JavaScript-код остается без изменений
    const chatBox = document.getElementById('chat-box');
    const questionInput = document.getElementById('question-input');
    const sendButton = document.getElementById('send-button');

    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'bubble';
        bubbleDiv.textContent = text;
        messageDiv.appendChild(bubbleDiv);
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
        const question = questionInput.value.trim();
        if (!question) return;
        addMessage(question, 'user');
        questionInput.value = '';
        sendButton.disabled = true;
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loading';
        loadingDiv.className = 'message bot loading';
        loadingDiv.innerHTML = '<div class="bubble">Думаю...</div>';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        try {
            const response = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: question })
            });
            chatBox.removeChild(loadingDiv);
            if (response.ok) {
                const data = await response.json();
                addMessage(data.answer, 'bot');
            } else {
                addMessage('Произошла ошибка при обработке вашего запроса.', 'bot');
            }
        } catch (error) {
            console.error('Error:', error);
            chatBox.removeChild(loadingDiv);
            addMessage('Не удалось подключиться к серверу.', 'bot');
        } finally {
            sendButton.disabled = false;
        }
    }
    sendButton.addEventListener('click', handleSend);
    questionInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { handleSend(); }
    });
</script>
</body>
</html>
